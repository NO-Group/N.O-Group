name: Quality gates
on:
  pull_request:
  push:
    branches: [main, 'arena/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run build
      - run: npm exec --workspace @no-group/web -- playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: apps/no-group-web/test-results
          retention-days: 7
