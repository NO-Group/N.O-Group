name = "no-group-web"
pages_build_output_dir = "./dist"
compatibility_date = "2026-11-01"

[vars]
SEARCH_DAILY_LIMIT = "500"
SEARCH_IP_DAILY_LIMIT = "50"
SEARCH_IP_MINUTE_LIMIT = "6"
# Enable only after confirming that your Brave subscription permits result storage.
SEARCH_RESULT_CACHE = "false"
WEATHER_DAILY_LIMIT = "500"
SPORTS_DAILY_LIMIT = "500"

# Bind SEARCH_DB in the Cloudflare dashboard and apply migrations/0001_quota.sql.
# Or add [[d1_databases]] here with the real database ID after provisioning.
# Never put API keys or other secrets in this file.
